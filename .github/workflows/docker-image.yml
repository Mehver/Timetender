name: Docker Image CI

on:
  release:
    types: [created]

env:
  IMAGE_NAME: timetender

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    env:
      TZ: Asia/Shanghai
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Build standalone HTML
        working-directory: ./app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html "../timetender-${TAG}-standalone.html"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker images
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mehver/timetender:${{ env.TAG }}
            ghcr.io/mehver/timetender:latest
            docker.io/titanrgb/timetender:${{ env.TAG }}
            docker.io/titanrgb/timetender:latest

      - name: Export Docker images for the release
        run: |
          for PLATFORM in linux/amd64 linux/arm64; do
            ARCH="${PLATFORM#linux/}"
            echo "--- Building ${PLATFORM} ---"
            docker buildx build \
              --platform "${PLATFORM}" \
              --output "type=docker,dest=timetender-${TAG}-docker-${ARCH}.tar" \
              -t "titanrgb/timetender:${TAG}" \
              ./app
            gzip "timetender-${TAG}-docker-${ARCH}.tar"
          done

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: titanrgb/timetender
          readme-filepath: ./README.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            timetender-*-standalone.html
            timetender-*-docker-*.tar.gz

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp "timetender-${TAG}-standalone.html" public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
