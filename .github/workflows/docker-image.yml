name: Docker Image CI

on:
  release:
    types: [created]

env:
  IMAGE_NAME: timetender

jobs:
  get-tags:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    outputs:
      version-tag: ${{ steps.tag.outputs.version }}
    steps:
      - name: Get tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  push-ghcr:
    needs: get-tags
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mehver/timetender:${{ needs.get-tags.outputs.version-tag }}
            ghcr.io/mehver/timetender:latest

  push-dockerhub:
    needs: get-tags
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/titanrgb/timetender:${{ needs.get-tags.outputs.version-tag }}
            docker.io/titanrgb/timetender:latest

  release-assets:
    needs: get-tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Build standalone HTML
        env:
          TAG: ${{ needs.get-tags.outputs.version-tag }}
        working-directory: ./app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html "../timetender-${TAG}-standalone.htm"

      - name: Build and export Docker images
        env:
          TAG: ${{ needs.get-tags.outputs.version-tag }}
        run: |
          for PLATFORM in linux/amd64 linux/arm64; do
            ARCH="${PLATFORM#linux/}"
            echo "--- Building ${PLATFORM} ---"
            docker buildx build \
              --platform "${PLATFORM}" \
              --output "type=docker,dest=timetender-${TAG}-docker-${ARCH}.tar" \
              -t "titanrgb/timetender:${TAG}" \
              ./app
            gzip "timetender-${TAG}-docker-${ARCH}.tar"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.get-tags.outputs.version-tag }}
          files: |
            timetender-*-standalone.htm
            timetender-*-docker-*.tar.gz
