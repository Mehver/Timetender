name: Disposable Run

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Which disposable task to run
        options:
          - docker-retroactive-upload
          - pages-retroactive-publish
          - promote-h3-headings
          - rename-deployment-environments
          - rename-docker-hub-deployment-environment
      dry_run:
        type: boolean
        default: true
      confirm:
        type: string
        description: 'Type YES to really modify releases'
        required: true

permissions:
  contents: write
  deployments: write
  pages: write
  id-token: write

jobs:
  run:
    if: ${{ github.event.inputs.dry_run == 'true' || github.event.inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install @octokit/rest

      - run: node .github/disposable/2026-07-27-docker-retroactive-upload/fix.js
        if: ${{ github.event.inputs.target == 'docker-retroactive-upload' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - run: node .github/disposable/2026-07-29-pages-retroactive-publish/fix.js
        if: ${{ github.event.inputs.target == 'pages-retroactive-publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - run: node .github/disposable/2026-08-24-release-notes-promote-h3-headings/fix.js
        if: ${{ github.event.inputs.target == 'promote-h3-headings' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - run: node .github/disposable/2026-08-24-deployment-environment-rename/fix.js
        if: ${{ github.event.inputs.target == 'rename-deployment-environments' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - run: node .github/disposable/2026-08-31-docker-hub-deployment-rename/fix.js
        if: ${{ github.event.inputs.target == 'rename-docker-hub-deployment-environment' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event.inputs.target == 'pages-retroactive-publish' && github.event.inputs.dry_run == 'false' }}
        with:
          path: public

      - uses: actions/deploy-pages@v4
        if: ${{ github.event.inputs.target == 'pages-retroactive-publish' && github.event.inputs.dry_run == 'false' }}
